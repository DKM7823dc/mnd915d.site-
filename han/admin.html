<!doctype html>
<!--
  상담 신청 관리 백엔드 (로컬 미리보기용)
  worker.js 내부 ADMIN_HTML 과 동일한 화면. API 주소는 아래 var API 로 통일.
  정식 입구: https://rapid-sea-a080.mkyusds82a.workers.dev/admin
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상담 신청 관리</title>
<style>
  :root{
    --g:#0d7b48;--gd:#08683c;--gb:#10945b;--soft:#eaf7ef;
    --line:#e5ece8;--txt:#1a211c;--mut:#6b756e;--bg:#f3f7f5;
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--txt);
    background:
      radial-gradient(circle at 12% -4%, rgba(29,145,92,.08), transparent 30rem),
      var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Microsoft YaHei",sans-serif;
    letter-spacing:-.01em;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:26px 16px 56px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(27,76,51,.06)}

  /* 로그인 */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{width:min(400px,100%);padding:38px 32px 30px}
  .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px}
  .logo-mark{position:relative;width:16px;height:16px;border-radius:50% 50% 46% 50%;background:var(--g);transform:rotate(-35deg);flex:0 0 auto}
  .logo-mark:after{content:"";position:absolute;left:7px;top:1px;width:1px;height:14px;background:rgba(255,255,255,.85);transform:rotate(35deg)}
  .logo span{font-size:17px;font-weight:800;color:var(--g)}
  .login-sub{text-align:center;color:var(--mut);font-size:12.5px;margin:0 0 26px}
  .field-l{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}
  .field-l:first-of-type{margin-top:0}
  .input{width:100%;height:46px;border:1px solid #d9e3dd;border-radius:11px;padding:0 13px;font-size:14px;outline:0;background:#fbfdfc;transition:.16s}
  .input:focus{border-color:var(--gb);background:#fff;box-shadow:0 0 0 3px rgba(22,131,80,.10)}
  .err{color:#d94343;font-size:12px;min-height:17px;margin-top:8px}
  .btn-primary{width:100%;height:48px;margin-top:6px;border:0;border-radius:11px;color:#fff;background:linear-gradient(90deg,var(--gb),var(--g));font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(12,113,68,.18);transition:.16s}
  .btn-primary:hover{filter:brightness(1.04);transform:translateY(-1px)}

  /* 헤더 */
  .header{background:linear-gradient(120deg,#15985b,#0a7d46 55%,#076839);border-radius:16px;padding:20px 24px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(14,111,66,.16)}
  .header .t{font-size:18px;font-weight:800;letter-spacing:-.02em}
  .header .s{font-size:12px;color:rgba(255,255,255,.8);margin-top:3px}
  .header .sp{flex:1}
  .btn-ghost{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:9px;height:38px;padding:0 15px;font-size:13px;font-weight:700;cursor:pointer}
  .btn-ghost:hover{background:rgba(255,255,255,.22)}

  /* 통계 */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px}
  .stat-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
  .stat-ic.g{background:var(--soft);color:var(--g)}
  .stat-ic.y{background:#fff6e0;color:#b98a00}
  .stat-ic.b{background:#e8f1fb;color:#3a6ea8}
  .stat .v{font-size:22px;font-weight:850;line-height:1.1}
  .stat .k{font-size:12px;color:var(--mut);margin-top:3px}
  .stat .k small{display:block;font-weight:500;color:#9aa49d;margin-top:2px;font-size:11px}

  /* 툴바 */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
  .toolbar .sp{flex:1}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--mut);height:34px;padding:0 15px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
  .seg button.active{background:var(--g);color:#fff;box-shadow:0 4px 10px rgba(13,123,72,.22)}
  .btn{border:1px solid var(--line);background:#fff;color:#2b3a32;border-radius:10px;height:40px;padding:0 15px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:#bcd8c9;background:#f7fbf8}
  .count-pill{font-size:12.5px;color:var(--mut)}

  /* 테이블 */
  .tbl-card{margin-top:12px;overflow:hidden}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  thead th{background:#f0f7f3;color:#4c5a52;font-size:12px;font-weight:700;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
  tbody td{padding:12px 14px;border-bottom:1px solid #eef3f0;vertical-align:top}
  tbody tr:nth-child(even){background:#fafcfb}
  tbody tr:hover{background:#f2f9f5}
  td.rmk{max-width:240px;white-space:normal;min-width:160px}
  .rmk-text{color:#4b554f;display:inline-block;word-break:break-all}
  .rmk-empty{color:#c2c9c4}
  .mini{border:1px solid #d5e0da;background:#f7faf8;color:var(--g);border-radius:7px;font-size:11px;padding:3px 9px;cursor:pointer;font-weight:700}
  .mini:hover{background:#e9f4ee}
  input.rmk-input{width:100%;border:1px solid #34956a;border-radius:8px;padding:6px 9px;font-size:12.5px;font-family:inherit;outline:0}
  .tag{display:inline-block;background:#fff4d6;color:#a97c00;border-radius:6px;font-size:11px;font-weight:800;padding:2px 7px}
  .tag.new{background:var(--soft);color:var(--g)}
  .empty{text-align:center;color:#9aa49d;padding:40px !important}
  .muted{color:var(--mut)}
  @media (max-width:640px){
    .stats{grid-template-columns:1fr 1fr}
    .stats .stat:last-child{grid-column:1 / -1}
    .header{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" class="login-wrap">
    <div class="card login-card">
      <div class="logo"><span class="logo-mark" aria-hidden="true"></span><span>상담 신청 관리</span></div>
      <p class="login-sub">자연한의원 다이어트 상담 신청 내역</p>
      <label class="field-l">账号</label>
      <input class="input" id="user" autocomplete="username" placeholder="请输入账号">
      <label class="field-l">密码</label>
      <input class="input" id="pass" type="password" autocomplete="current-password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
      <div class="err" id="loginError"></div>
      <button class="btn-primary" onclick="doLogin()">登 录</button>
    </div>
  </div>

  <div id="listView" style="display:none">
    <div class="header">
      <div>
        <div class="t">表单提交记录</div>
        <div class="s">다이어트 상담 신청 관리 · 로그인 후 최근 3일 기본 조회</div>
      </div>
      <div class="sp"></div>
      <button class="btn-ghost" onclick="exportCsv()">导出 CSV</button>
      <button class="btn-ghost" onclick="logout()">退出</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-ic g">📋</div>
        <div><div class="v" id="stTotal">0</div><div class="k">当前记录</div></div>
      </div>
      <div class="stat">
        <div class="stat-ic y">🔁</div>
        <div><div class="v" id="stDup">0</div><div class="k">重复提交</div></div>
      </div>
      <div class="stat">
        <div class="stat-ic b">🕒</div>
        <div><div class="v" id="stLatest" style="font-size:15px">—</div><div class="k">最新提交<small>北京时间 (UTC+8)</small></div></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="seg">
        <button id="btn3" onclick="setRange(3)">最近3天</button>
        <button id="btnAll" onclick="setRange('all')">全部</button>
      </div>
      <button class="btn" onclick="loadList()">⟳ 刷新</button>
      <span class="sp"></span>
      <span class="count-pill" id="count"></span>
    </div>

    <div class="card tbl-card">
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>ID</th><th>提交时间</th><th>姓名</th><th>电话</th><th>目标</th><th>性别</th>
            <th>年龄</th><th>身高</th><th>体重</th><th>来源</th><th>备注</th><th>标记</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
<script>
var API = 'https://rapid-sea-a080.mkyusds82a.workers.dev';
var token = sessionStorage.getItem('token');
var range = 3;
if (token) { showList(); loadList(); }

function $(id){ return document.getElementById(id); }

function doLogin(){
  fetch(API + '/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user:$('user').value,pass:$('pass').value})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d && d.ok){ sessionStorage.setItem('token',d.token); token=d.token; showList(); loadList(); }
      else $('loginError').textContent = (d && d.error) || '登录失败';
    })
    .catch(function(){ $('loginError').textContent = '网络错误'; });
}

function showList(){
  $('loginView').style.display='none';
  $('listView').style.display='block';
  setRangeBtn();
}

function setRange(v){ range=v; setRangeBtn(); loadList(); }
function setRangeBtn(){
  $('btn3').className = range===3 ? 'active' : '';
  $('btnAll').className = range==='all' ? 'active' : '';
}

function logout(){ sessionStorage.removeItem('token'); location.reload(); }
function authHeaders(){ return {'Authorization':'Bearer '+token}; }

function loadList(){
  var url = API + '/api/leads?limit=1000' + (range==='all' ? '&all=1' : '');
  fetch(url,{headers:authHeaders()})
    .then(function(r){ if(r.status===401){ logout(); return; } return r.json(); })
    .then(function(d){
      if(!d || !d.ok) return;
      $('count').textContent = '共 ' + d.count + ' 条';
      render(d.leads);
    });
}

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(rows){
  var tb = $('tbody');
  tb.innerHTML = '';

  var dup = rows.filter(function(r){ return r.is_duplicate; }).length;
  $('stTotal').textContent = rows.length;
  $('stDup').textContent = dup;
  $('stLatest').textContent = rows.length ? rows[0].created_at_cn : '—';

  if(!rows.length){
    tb.innerHTML = '<tr><td colspan="12" class="empty">最近3天暂无提交记录</td></tr>';
    return;
  }
  rows.forEach(function(r){
    var tr = document.createElement('tr');
    var rmk = r.remark ? esc(r.remark) : '<span class="rmk-empty">(无)</span>';
    tr.innerHTML =
      '<td class="muted">'+r.id+'</td>'+
      '<td>'+esc(r.created_at_cn)+'</td>'+
      '<td><b>'+esc(r.name)+'</b></td>'+
      '<td>'+esc(r.phone)+'</td>'+
      '<td>'+esc(r.goal)+'</td>'+
      '<td>'+esc(r.gender)+'</td>'+
      '<td>'+r.age+'</td>'+
      '<td>'+r.height+'</td>'+
      '<td>'+r.weight+'</td>'+
      '<td>'+esc(r.source)+'</td>'+
      '<td class="rmk" data-id="'+r.id+'"><span class="rmk-text">'+rmk+'</span> <button class="mini" onclick="startEdit('+r.id+')">编辑</button></td>'+
      '<td>'+(r.is_duplicate ? '<span class="tag">重复</span>' : '<span class="tag new">新</span>')+'</td>';
    tb.appendChild(tr);
  });
}

function startEdit(id){
  var cell = document.querySelector('td.rmk[data-id="'+id+'"]');
  if(!cell) return;
  var cur = cell.querySelector('.rmk-text').textContent;
  cell.innerHTML = '<input class="rmk-input" id="rmk-in-'+id+'" value="'+esc(cur)+'"> '+
    '<button class="mini" onclick="saveRmk('+id+')">保存</button> '+
    '<button class="mini" onclick="loadList()">取消</button>';
  $('rmk-in-'+id).focus();
}

function saveRmk(id){
  var v = $('rmk-in-'+id).value;
  fetch(API + '/api/leads/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({remark:v})})
    .then(function(r){return r.json();})
    .then(function(d){ if(d && d.ok) loadList(); else alert('保存失败'); });
}

function exportCsv(){
  location.href = API + '/api/leads?format=csv&all=1&token=' + encodeURIComponent(token);
}
</script>
</body>
</html>
