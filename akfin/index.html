    case "ethnicity": renderEthnicity(); break;
    case "body": renderGrid("body","bodyType","cols-2"); break;
    case "breast": renderGrid("breast","breastSize","cols-2"); break;
    case "booty": renderGrid("booty","buttSize","cols-2"); break;
    case "hairStyle": renderGrid("hairStyle","hairStyle","cols-3"); break;
    case "hairColor": renderGrid("hairColor","hairColor","cols-3"); break;
    case "eyeColor": renderGrid("eyeColor","eyeColor","cols-3"); break;
    case "voice": renderVoice(); break;
    case "personality": renderPersonality(); break;
    case "kinks": renderKinks(); break;
    case "result": renderResult(); break;
    case "paywall": renderPaywall(); break;
  }
}

function heading(step, subtitle){
  const h = el(`<div class="fade-in">
      <h1 class="title">${titleHTML(step.title)}</h1>
      ${step.sub ? `<p class="subtitle">${step.sub}</p>` : ""}
    </div>`);
  app.appendChild(h);
}

function nav(back=true, nextLabel="Next", onNext){
  const n = el(`<div class="nav">
      ${back ? `<button class="btn btn-back">Go back</button>` : ""}
      <button class="btn btn-next">${nextLabel}</button>
    </div>`);
  const nextBtn = n.querySelector(".btn-next");
  nextBtn.disabled = true;
  nextBtn.addEventListener("click", ()=> onNext && onNext());
  if (back) n.querySelector(".btn-back").addEventListener("click", ()=> go(-1));
  app.appendChild(n);
  return nextBtn;
}

function go(delta){ state.step += delta; if(state.step<0) state.step=0; render(); }
function next(){ state.step++; render(); }

/* ---------- step renderers ---------- */
function renderStyle(){
  const step = STEPS[state.step];
  heading(step, undefined);
  const wrap = el(`<div class="style-cards"></div>`);
  DATA.style.forEach(o=>{
    const card = el(`<div class="style-card" data-v="${o.value}">
      <div class="sc-img">
        <img src="${o.img}" alt="${o.label}" loading="eager">
      </div>
      <div class="sc-label">${o.label}</div>
    </div>`);
    card.addEventListener("click", ()=>{
      state.sel.style = o.value;
      document.querySelectorAll(".style-card").forEach(c=>c.classList.remove("selected"));
      card.classList.add("selected");
      nextBtn.disabled = false;
    });
    wrap.appendChild(card);
  });
  app.appendChild(wrap);
  const nextBtn = nav(false, "Next", ()=> next());
}

function renderEthnicity(){
  const step = STEPS[state.step];
  heading(step);
  const wrap = el(`<div class="options cols-2"></div>`);
  DATA.ethnicity.forEach(o=>{
    const opt = el(`<div class="opt" data-v="${o.value}">
      <div class="opt-img"><img src="${o.img}" alt="${o.label}" loading="lazy"></div>
      <div class="opt-label">${o.label}</div>
      <div class="check"></div>
    </div>`);
    opt.addEventListener("click", ()=>{
      state.sel.ethnicity = o.value;
      document.querySelectorAll(".options .opt").forEach(c=>c.classList.remove("selected"));
      opt.classList.add("selected");
      nextBtn.disabled = false;
    });
    wrap.appendChild(opt);
  });
  app.appendChild(wrap);

  // age slider
  const age = el(`<div class="age-block fade-in">
      <div class="age-head">Choose age</div>
      <div class="age-row">
        <span class="age-num">18+</span>
        <input class="age-slider" type="range" min="18" max="55" value="${state.sel.age}">
        <span class="age-num">55+</span>
        <span class="age-val">${state.sel.age}</span>
      </div>
    </div>`);
  const slider = age.querySelector(".age-slider");
  const val = age.querySelector(".age-val");
  slider.addEventListener("input", ()=>{
    state.sel.age = +slider.value;
    val.textContent = state.sel.age;
    slider.style.setProperty("--fill", ((slider.value-18)/37*100)+"%");
  });
  slider.style.setProperty("--fill", ((state.sel.age-18)/37*100)+"%");
  app.appendChild(age);

  const nextBtn = nav(true, "Next", ()=> next());
  if (state.sel.ethnicity) nextBtn.disabled = false;
}

function renderGrid(key, dataKey, cols){
  const step = STEPS[state.step];
  heading(step);
  const wrap = el(`<div class="options ${cols}"></div>`);
  DATA[dataKey].forEach(o=>{
    const opt = el(`<div class="opt" data-v="${o.value}">
      <div class="opt-img"><img src="${o.img}" alt="${o.label}" loading="lazy"></div>
      <div class="opt-label">${o.label}</div>
      <div class="check"></div>
    </div>`);
    opt.addEventListener("click", ()=>{

      document.querySelectorAll(".options .opt").forEach(c=>c.classList.remove("selected"));

      nextBtn.disabled = false;

    wrap.appendChild(opt);

  const nextBtn = nav(true, "Next", ()=> next());
  if (state.sel[key]) nextBtn.disabled = false;
}

function renderResult(){
  const step = STEPS[state.step];
  const styleObj = DATA.style.find(x=>x.value===state.sel.style) || DATA.style[0];
  const persona = DATA.personaV2[Math.floor(Math.random()*DATA.personaV2.length)];

  app.appendChild(el(`<div class="fade-in" style="text-align:center">
      <span class="ribbon">✨ Limited offer — only <b>&nbsp;0.33$/Day</b></span>
      <h1 class="title">${titleHTML(step.title)}</h1>
    </div>`));

  // main result visual
  const main = el(`<div class="result-main">
      <img src="${styleObj.img}" alt="${styleObj.label}">
      <div class="rm-label">${styleObj.label} · ${state.sel.age} years</div>
    </div>`);
  app.appendChild(main);

  // attribute cards
  const eth = DATA.ethnicity.find(x=>x.value===state.sel.ethnicity);
  const body = DATA.bodyType.find(x=>x.value===state.sel.body);
  const breast = DATA.breastSize.find(x=>x.value===state.sel.breast);
  const booty = DATA.buttSize.find(x=>x.value===state.sel.booty);
  const hairC = DATA.hairColor.find(x=>x.value===state.sel.hairColor);
  const hairS = DATA.hairStyle.find(x=>x.value===state.sel.hairStyle);
  const eye = DATA.eyeColor.find(x=>x.value===state.sel.eyeColor);
  const voice = DATA.voice.find(x=>x.value===state.sel.voice);
  const pers = DATA.personality.find(x=>x.value===state.sel.personality);

  const cards = [];
  if (eth)   cards.push({ img:eth.img,   txt:eth.label });
  cards.push({ age:state.sel.age });
  if (body)  cards.push({ img:body.img,  txt:body.label });
  if (breast)cards.push({ img:breast.img,txt:breast.label });
  if (booty) cards.push({ img:booty.img, txt:booty.label });
  if (hairC) cards.push({ img:hairC.img, txt:hairC.label });
  if (hairS) cards.push({ img:hairS.img, txt:hairS.label });
  if (eye)   cards.push({ img:eye.img,   txt:eye.label });
  if (voice) cards.push({ img:null,       txt:voice.icon+" "+voice.label });
  if (pers)  cards.push({ img:null,       txt:pers.label });
  cards.push({ img:persona.img, txt:persona.label });

  const grid = el(`<div class="result-grid"></div>`);
  cards.forEach(c=>{
    const card = el(`<div class="r-card">
      ${c.img ? `<img src="${c.img}" alt="" loading="lazy">` : ""}
      ${c.age ? `<div class="age-number">${c.age}</div>` : ""}
      <span>${c.txt || "years"}</span>
    </div>`);
    grid.appendChild(card);
  });
  app.appendChild(grid);

  const btn = el(`<button class="sparkle-btn">✨ Bring my AI to life</button>`);
  btn.addEventListener("click", ()=>{
    // fake "setting the scene" generation, then paywall
    app.innerHTML = "";
    app.appendChild(el(`<div class="topbar"><div class="logo">SWIPEY</div><div class="badge">18+ AI Fantasy</div></div>`));
    const lw = el(`<div class="loading-wrap fade-in">
        <div class="loading-heart">💜</div>
        <div class="loading-bar"><i style="width:0%"></i></div>
        <div class="loading-pct">0%</div>
        <div class="loading-label">Setting The Scene…</div>
      </div>`);
    app.appendChild(lw);
    const fill = lw.querySelector(".loading-bar i");
    const pct = lw.querySelector(".loading-pct");
    let p = 0;
    const t = setInterval(()=>{
      p += 4 + Math.random()*9;
      if (p >= 100){ p = 100; clearInterval(t); state.step = STEPS.indexOf(STEPS.find(x=>x.id==="paywall")); render(); return; }
      fill.style.width = p+"%";
      pct.textContent = Math.floor(p)+"%";
    }, 130);
  });
  app.appendChild(btn);
}
