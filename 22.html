<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in Safari</title>
  <style>
    body {
      margin: 0;
      padding: 48px 20px;
      background: #f5f5f7;
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      max-width: 420px;
      margin: auto;
      padding: 28px 22px;
      background: #fff;
      border-radius: 16px;
    }

    a {
      display: block;
      margin-top: 24px;
      padding: 14px;
      border-radius: 10px;
      background: #007aff;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    .note {
      color: #6e6e73;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Open in Safari</h1>
    <p>
      For the best experience, please open this page in Apple Safari.
    </p>
    <p class="note">
      Tap the Share button, then select
      <strong>Open in Safari</strong>.
    </p>
    <a href="https://sum812m.site/usdt/">
      Continue
    </a>
  </main>
</body>
</html>
