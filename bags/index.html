.marquee {

@keyframes scroll {

/* ===== Big Image ===== */

<script>
// ============================================================
// 整合后的 JavaScript（轮询 + 弹窗 + 倒计时）
// ============================================================

// ============================================================
// 1. 号码池
// ============================================================
const whatsappNumbers = [
    
];

// ============================================================
// 2. 核心轮询逻辑
// ============================================================
let lastUsedIndex = -1;

function getNextNumber() {
    const total = whatsappNumbers.length;
    if (total === 1) {
        return whatsappNumbers[0];
    }
    let randomIndex;
    let attempts = 0;
    const maxAttempts = 100;
    do {
        randomIndex = Math.floor(Math.random() * total);
        attempts++;
        if (attempts > maxAttempts) {
            randomIndex = (lastUsedIndex + 1) % total;
            break;
        }
    } while (randomIndex === lastUsedIndex);
    lastUsedIndex = randomIndex;
    return whatsappNumbers[randomIndex];
}

// ============================================================
// 3. Facebook Pixel 跟踪
// ============================================================
function trackFB() {
    if (typeof fbq !== 'undefined') {
        fbq('track', 'Contact', {
            content_name: 'WhatsApp Click',
            content_category: 'Lead',
            method: 'WhatsApp'
        });
        console.log('[FB Pixel] Contact 事件已触发');
    } else {
        console.log('[FB Pixel 模拟] Contact 事件');
    }
}

// ============================================================
// 4. 打开 WhatsApp（所有按钮共用）
// ============================================================
function openWA() {
    const number = getNextNumber();
    trackFB();
    const defaultMessage = "Hi, I saw your FB ad. I want to check price & real photos?";
    const encodedMessage = encodeURIComponent(defaultMessage);
    const url = `https://wa.me/${number}?text=${encodedMessage}`;
    window.open(url, '_blank');
    // 关闭弹窗
    closePopup();
}

// ============================================================
// 5. 弹窗控制
// ============================================================
const modal = document.getElementById('offerModal');

function showPopup() {
    if (!modal) return;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closePopup() {
    if (!modal) return;
    modal.classList.remove('active');
    document.body.style.overflow = '';
}

// ============================================================
// 6. 倒计时 (2分钟)
// ============================================================
let totalSeconds = 120;
const minutesEl = document.getElementById('minutesDisplay');
const secondsEl = document.getElementById('secondsDisplay');

function updateCountdown() {
    if (totalSeconds < 0) {
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        return;
    }
    const mins = Math.floor(totalSeconds / 60);
    const secs = totalSeconds % 60;
    minutesEl.textContent = String(mins).padStart(2, '0');
    secondsEl.textContent = String(secs).padStart(2, '0');
    totalSeconds--;
}

updateCountdown();
const timerInterval = setInterval(() => {
    updateCountdown();
    if (totalSeconds < 0) {
        clearInterval(timerInterval);
    }
}, 1000);

// ============================================================
// 7. 绑定所有按钮事件
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    // 所有 WhatsApp 按钮（共用 openWA）
    const bannerBtn = document.getElementById('bannerBtn');
    const floatBtn = document.getElementById('floatBtn');
    const popupWaBtn = document.getElementById('popupWhatsAppBtn');

    // 绑定 WhatsApp 按钮
    if (bannerBtn) bannerBtn.addEventListener('click', k2wa);
    if (floatBtn) floatBtn.addEventListener('click', k2wa);
    if (popupWaBtn) popupWaBtn.addEventListener('click', k2wa);

    // 关闭弹窗按钮
    const closeBtn = document.getElementById('closeModalBtn');
    if (closeBtn) {
        closeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            closePopup();
        });
    }

    // 访问网站按钮
    const websiteBtn = document.getElementById('websiteBtn');
    if (websiteBtn) {
        websiteBtn.addEventListener('click', function(e) {
            e.preventDefault();
            closePopup();
            // 跳转到网站
            window.location.href = 'https://www.xixibag.xyz/';
        });
    }

    // 点击背景关闭弹窗
    if (modal) {
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closePopup();
            }
        });
    }

    // ============================================================
    // 8. 自动弹出弹窗 (延迟1.2秒)
    // ============================================================
    setTimeout(function() {
        showPopup();
    }, 5000);

    console.log('✅ 轮询已初始化, 号码池:', whatsappNumbers.length, '个');
    console.log('📌 所有 WhatsApp 按钮共用轮询逻辑，不会连续重复');
    console.log('⏰ 弹窗将在 3后自动弹出');
});
</script>
